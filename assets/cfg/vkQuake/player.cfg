// Personal settings override game.cfg. Updated by wizard.py.
// NetQuake has no team-name setting equivalent to ezQuake's team cvar.
name                                  "Player"
sensitivity                           "3"

// Desktop fullscreen is the fallback when display detection is unavailable.
// The wizard adds vid_width, vid_height and vid_refreshrate for an explicit mode.
vid_fullscreen                        "1"
vid_desktopfullscreen                 "1"
