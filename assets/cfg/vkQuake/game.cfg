////////////////////////////////////////////////////////////////////////////////////////////////////
//                                V K Q U A K E   C O N F I G U R A T I O N
////////////////////////////////////////////////////////////////////////////////////////////////////
// Adapted from ../ezquake/game.cfg for single-player NetQuake.
// QuakeWorld downloads, rulesets, teamplay macros, skins and custom HUD commands do not apply.

// MENU & INPUT
lookstrafe                            "0"
lookspring                            "0"
+mlook
// Run normally; hold Shift to walk. vkQuake uses SDL relative mouse input.
cl_alwaysrun                          "1"
cl_forwardspeed                       "200"
cl_backspeed                          "200"
cl_sidespeed                          "350"
cl_movespeedkey                       "2"

// VIDEO
// vkQuake separates rendering and physics at high frame rates.
host_maxfps                           "288"
vid_vsync                             "0"
scr_conscale                          "2"

// GRAPHICS & EFFECTS
gamma                                 "0.75"
contrast                              "1"
vid_filter                            "0" // Linear texture filtering
gl_polyblend                          "0"
r_dynamic                             "1"
r_particles                           "1" // Smooth particles; ezQuake's particle effects have no direct equivalent

// HUD & VIEW
crosshair                             "1"
fov                                   "110"
cl_bob                                "0"
v_kickpitch                           "0"
v_kickroll                            "0"
v_kicktime                            "0"
v_gunkick                             "0"
// Native zoom also scales mouse input with the field of view.
zoom_fov                              "88"

// SINGLE PLAYER
deathmatch                            "0"
coop                                  "0"
teamplay                              "0"

// BINDS
unbindall
bind                                  1             "impulse 1"
bind                                  2             "impulse 2"
bind                                  3             "impulse 3"
bind                                  4             "impulse 4"
bind                                  5             "impulse 5"
bind                                  6             "impulse 6"
bind                                  7             "impulse 7"
bind                                  8             "impulse 8"

bind                                  w             "+forward"
bind                                  a             "+moveleft"
bind                                  s             "+back"
bind                                  d             "+moveright"
bind                                  SPACE         "+jump"
bind                                  SHIFT         "+speed"
bind                                  CTRL          "+movedown"
bind                                  MOUSE1        "+attack"
bind                                  MOUSE2        "+zoom"
bind                                  MWHEELDOWN    "impulse 12"
bind                                  MWHEELUP      "impulse 10"

bind                                  q             "impulse 7"
bind                                  e             "impulse 1"
bind                                  r             "impulse 5"
bind                                  f             "impulse 3"
bind                                  z             "impulse 6"
bind                                  x             "impulse 8"

bind                                  ESCAPE        "togglemenu"
bind                                  F1            "help"
bind                                  F2            "menu_save"
bind                                  F3            "menu_load"
bind                                  F4            "menu_options"
bind                                  F5            "menu_multiplayer"
bind                                  F10           "quit"
bind                                  F12           "screenshot"
bind                                  PAUSE         "pause"
bind                                  TAB           "+showscores"
bind                                  `             "toggleconsole"
bind                                  t             "messagemode"
bind                                  y             "messagemode2"
