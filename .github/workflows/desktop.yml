name: Build Qt6 desktop

on:
  push:
    paths:
      - 'quake_gui/**'
      - 'quake_installer/**'
      - 'assets/**'
      - 'tests/**'
      - 'quakebundle.py'
      - 'QuakeBundle.spec'
      - 'requirements-*.txt'
      - 'README.md'
      - '.github/workflows/desktop.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-build.txt
            requirements-gui.txt
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python quakebundle.py --smoke-test
      - run: python -m PyInstaller --noconfirm QuakeBundle.spec
      - name: Test packaged application (Linux)
        if: runner.os == 'Linux'
        run: dist/QuakeBundle/QuakeBundle --smoke-test
      - name: Test packaged application (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $process = Start-Process dist/QuakeBundle/QuakeBundle.exe -ArgumentList '--smoke-test' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Smoke test failed: $($process.ExitCode)" }
      - name: Test packaged application (macOS)
        if: runner.os == 'macOS'
        run: dist/QuakeBundle.app/Contents/MacOS/QuakeBundle --smoke-test
      - name: Archive application (Linux)
        if: runner.os == 'Linux'
        run: tar -C dist -czf QuakeBundle-${{ matrix.os }}.tar.gz QuakeBundle
      - name: Archive application (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/QuakeBundle.app QuakeBundle-${{ matrix.os }}.zip
      - name: Archive application (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/QuakeBundle -DestinationPath QuakeBundle-${{ matrix.os }}.zip
      - uses: actions/upload-artifact@v6
        with:
          name: QuakeBundle-${{ matrix.os }}
          path: |
            QuakeBundle-*.tar.gz
            QuakeBundle-*.zip
          if-no-files-found: error
