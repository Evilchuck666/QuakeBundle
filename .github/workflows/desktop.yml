name: Build Qt6 desktop

on:
  push:
    paths:
      - 'quake_gui/**'
      - 'quake_installer/**'
      - 'assets/**'
      - 'tests/**'
      - 'quakebundle.py'
      - 'build-*.sh'
      - 'build-windows.ps1'
      - 'scripts/build.py'
      - 'QuakeBundle.spec'
      - 'requirements-*.txt'
      - 'README.md'
      - '.github/workflows/desktop.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-build.txt
            requirements-gui.txt
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python quakebundle.py --smoke-test
      - name: Build and verify the standalone package
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux) target=linux ;;
            Windows) target=windows ;;
            macOS) target=macos ;;
          esac
          python scripts/build.py --platform "$target"
      - uses: actions/upload-artifact@v6
        with:
          name: QuakeBundle-${{ matrix.os }}
          path: |
            dist/QuakeBundle-*.tar.gz
            dist/QuakeBundle-*.zip
          if-no-files-found: error
