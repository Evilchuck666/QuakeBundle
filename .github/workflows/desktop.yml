name: Build Qt6 desktop

on:
  push:
    paths:
      - 'quake_gui/**'
      - 'quake_installer/**'
      - 'assets/**'
      - 'tests/**'
      - 'quakebundle.py'
      - 'QuakeBundle.spec'
      - 'requirements-*.txt'
      - 'README.md'
      - '.github/workflows/desktop.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements-build.txt
            requirements-gui.txt
      - name: Install Qt runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python quakebundle.py --smoke-test
      - run: python -m PyInstaller --noconfirm QuakeBundle.spec
      - name: Test packaged application (Linux)
        if: runner.os == 'Linux'
        run: dist/QuakeBundle/QuakeBundle --smoke-test
      - name: Test packaged application (macOS)
        if: runner.os == 'macOS'
        run: dist/QuakeBundle.app/Contents/MacOS/QuakeBundle --smoke-test
      - name: Archive application (Linux)
        if: runner.os == 'Linux'
        run: tar -C dist -czf QuakeBundle-${{ matrix.os }}.tar.gz QuakeBundle
      - name: Archive application (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/QuakeBundle.app QuakeBundle-${{ matrix.os }}.zip
      - name: Archive application (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/QuakeBundle -DestinationPath QuakeBundle-${{ matrix.os }}.zip
      - name: Test Windows ZIP without Python on PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'QuakeBundle standalone test'
          Expand-Archive QuakeBundle-${{ matrix.os }}.zip -DestinationPath $destination
          $executable = Join-Path $destination 'QuakeBundle/QuakeBundle.exe'
          # Use the delivered ZIP, outside the checkout, with only Windows on PATH.
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          foreach ($name in @('PYTHONHOME', 'PYTHONPATH', 'VIRTUAL_ENV', 'QT_PLUGIN_PATH', 'QT_QPA_PLATFORM_PLUGIN_PATH')) {
            Remove-Item "Env:$name" -ErrorAction SilentlyContinue
          }
          $process = Start-Process $executable -WorkingDirectory $destination -ArgumentList '--smoke-test --screenshot preview.png' -PassThru
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw 'Standalone smoke test timed out'
          }
          if ($process.ExitCode -ne 0) { throw "Smoke test failed: $($process.ExitCode)" }
          $preview = Join-Path $destination 'preview.png'
          if (-not (Test-Path $preview) -or (Get-Item $preview).Length -eq 0) {
            throw 'Standalone application did not render its window'
          }
      - uses: actions/upload-artifact@v6
        with:
          name: QuakeBundle-${{ matrix.os }}
          path: |
            QuakeBundle-*.tar.gz
            QuakeBundle-*.zip
          if-no-files-found: error
